map:
  # Map source. case_id=2 loads the fixed example PCD below.
  case_id: 2
  pcd_folder: "exp_pcd/world_x[-6.00,6.00]_y[-6.00,6.00]_obs120_20251219_061529"
  has_goal_set: true
  num_goals: 10

  # These values are used by the simulator and map loader.
  obs_num: [80, 80]
  wall_size_range: [0.2, 0.8]
  wall_height_range: [0.4, 1.5]
  float_size_range: [0.3, 0.6]
  float_height_range: [0.4, 0.8]
  resolution: 0.05
  size_x: 14.0
  size_y: 14.0
  min_obs_dis: 1.0
  vis_rate: 1.0
  fix_generator: false

  # Table-scene generation parameters, kept for completeness.
  desk_length_range: [0.75, 1.25]
  desk_width_range: [0.75, 1.25]
  desk_height_range: [0.5, 1.0]
  desk_arrangement_range: [1, 2]

  # Only used for visualization subsampling in the original experiment code.
  video_flag: 0
