planner_node:
  agent:
    # planner_tro_exp reads the fixed goal_list.txt and runs all goals once.
    mode: "planner_tro_exp"

    # Use "moma" for the TopAY baseline. Use "crisp" only when an external
    # solver node is connected through solver_input_list/solver_output_list.
    planner: "moma"

    local_mode: false
    planning_budget: 0.5
    replan_interval: 100.0
    planning_horizon: 6000.0
    only_front: false
    fixed_startgoal: false
    random_ee: true
    fixed_sequence: false
    startgoal_dist_range: [3.0, 7.0]
    stat_num: 1000
    scene: "tables"

    # Preserved example task states from the original configuration.
    pick_state: [3.3, 0.0, 0.0, 1.0259568691253662, 0.7873354554176331, -0.037315141409635544, 0.024556782096624374, 0.09346238523721695, 0.7401068210601807, -1.14198637008667]
    mid_state: [9.0, 1.5, 0.0, 1.0259568691253662, 0.7873354554176331, -0.037315141409635544, 0.024556782096624374, 0.09346238523721695, 0.7401068210601807, -1.14198637008667]
    place_state: [11.9, -0.3, 0.0, 1.0259568691253662, 0.7873354554176331, -0.037315141409635544, 0.024556782096624374, 0.09346238523721695, 0.7401068210601807, -1.14198637008667]
